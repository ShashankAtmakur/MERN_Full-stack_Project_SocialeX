services:
  # Backend API Service
  - type: web
    name: socialex-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URL
        sync: false
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /

  # Frontend Static Site
  - type: web
    name: socialex-client
    env: static
    region: oregon
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Database - MongoDB
databases:
  - name: socialex-db
    databaseName: socialeX
    user: socialeX_user
    plan: free
